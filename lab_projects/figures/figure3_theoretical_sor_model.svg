<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" width="100%" height="auto" style="font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif; background:#ffffff;">
  <defs>
    <marker id="marr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 Z" fill="#0284c7" />
    </marker>
    <marker id="marr-orange" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 Z" fill="#d97706" />
    </marker>
    <marker id="marr-rose" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 Z" fill="#e11d48" />
    </marker>
    <marker id="marr-purple" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 Z" fill="#7c3aed" />
    </marker>
    <filter id="mshadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Title Header -->
  <rect x="20" y="15" width="940" height="42" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="490" y="41" text-anchor="middle" font-size="13.5" font-weight="800" fill="#0f172a">FIGURE 3. DYNAMIC &amp; MULTIPLICATIVE DUAL-PATH S-O-R FRAMEWORK (GEN 1.0 TO GEN 2.0 AI)</text>

  <!-- S-O-R COLUMN CONTAINERS -->
  <!-- 1. STIMULUS CONTAINER -->
  <rect x="20" y="75" width="235" height="395" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4"/>
  <rect x="30" y="85" width="215" height="34" rx="6" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="137.5" y="106" text-anchor="middle" font-size="11.5" font-weight="800" fill="#0369a1">STIMULUS (S): AI GEN 1.0 &amp; 2.0</text>

  <!-- 2. ORGANISM CONTAINER (DUAL-PATH) -->
  <rect x="315" y="75" width="320" height="395" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4"/>
  <rect x="325" y="85" width="300" height="34" rx="6" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="475" y="106" text-anchor="middle" font-size="11.5" font-weight="800" fill="#0369a1">ORGANISM (O): DUAL-PATH STATES</text>

  <!-- 3. RESPONSE CONTAINER -->
  <rect x="695" y="75" width="265" height="395" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4"/>
  <rect x="705" y="85" width="245" height="34" rx="6" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="827.5" y="106" text-anchor="middle" font-size="11.5" font-weight="800" fill="#0369a1">RESPONSE (R): CONVERSION</text>

  <!-- ==================== BOXES INSIDE S ==================== -->
  <!-- Box S1: PP + Gen 2.0 Agency -->
  <rect x="35" y="135" width="205" height="80" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#mshadow)"/>
  <text x="137.5" y="158" text-anchor="middle" font-size="11.5" font-weight="800" fill="#0f172a">Perceived Personalization</text>
  <text x="137.5" y="176" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0284c7">(PP) &amp; GenAI Social Agency</text>
  <text x="137.5" y="196" text-anchor="middle" font-size="9.5" font-weight="700" fill="#e11d48">[Inverted-U Threshold: P1, P8]</text>

  <!-- Box S2: ACC -->
  <rect x="35" y="235" width="205" height="65" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#mshadow)"/>
  <text x="137.5" y="262" text-anchor="middle" font-size="11.5" font-weight="800" fill="#0f172a">Recommendation Accuracy</text>
  <text x="137.5" y="282" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0284c7">(ACC) [Expectancy Match]</text>

  <!-- Box S3: NOV + Conversational Persuasion -->
  <rect x="35" y="320" width="205" height="75" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#mshadow)"/>
  <text x="137.5" y="346" text-anchor="middle" font-size="11.5" font-weight="800" fill="#0f172a">Novelty &amp; Serendipity</text>
  <text x="137.5" y="365" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0284c7">(NOV) &amp; Real-Time Prompts</text>
  <text x="137.5" y="382" text-anchor="middle" font-size="9.5" font-weight="600" fill="#475569">[Cold-Start Discovery]</text>

  <!-- ==================== BOXES INSIDE O (DUAL-PATH + INTERACTION) ==================== -->
  <!-- Box O1: Cognitive Pathway (In-Session Fluency & Cumulative E-Satisfaction) -->
  <rect x="330" y="138" width="260" height="108" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="2" filter="url(#mshadow)"/>
  <rect x="340" y="146" width="240" height="22" rx="4" fill="#dcfce7"/>
  <text x="460" y="161" text-anchor="middle" font-size="10" font-weight="800" fill="#15803d">COGNITIVE PERMISSION STRUCTURE</text>
  <text x="460" y="188" text-anchor="middle" font-size="12" font-weight="800" fill="#0f172a">In-Session Fluency &amp; E-Satisfaction</text>
  <text x="460" y="206" text-anchor="middle" font-size="10.5" font-weight="600" fill="#166534">(ESAT) [Disarmed Vigilance: P4a]</text>
  <text x="460" y="228" text-anchor="middle" font-size="9.5" font-weight="700" fill="#e11d48">Endogenous Reactance if PP Excess (P8)</text>

  <!-- Multiplicative Interaction Node (ESAT x AROUSAL) -->
  <circle cx="605" cy="272" r="20" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5" filter="url(#mshadow)"/>
  <text x="605" y="278" text-anchor="middle" font-size="16" font-weight="800" fill="#1d4ed8">×</text>
  <rect x="550" y="295" width="110" height="20" rx="4" fill="#dbeafe"/>
  <text x="605" y="309" text-anchor="middle" font-size="9" font-weight="800" fill="#1e40af">Interaction (P5b)</text>

  <!-- Box O2: Affective Pathway (Emotional Arousal) -->
  <rect x="330" y="330" width="260" height="98" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="2" filter="url(#mshadow)"/>
  <rect x="340" y="338" width="240" height="22" rx="4" fill="#fee2e2"/>
  <text x="460" y="353" text-anchor="middle" font-size="10" font-weight="800" fill="#b91c1c">VISCERAL KINETIC ENERGY</text>
  <text x="460" y="380" text-anchor="middle" font-size="12.5" font-weight="800" fill="#0f172a">Emotional Arousal &amp; Flow</text>
  <text x="460" y="400" text-anchor="middle" font-size="10.5" font-weight="600" fill="#991b1b">(AROUSAL) [Hedonic Drive: P5a]</text>

  <!-- ==================== BOXES INSIDE R ==================== -->
  <!-- Box R1: UBI -->
  <rect x="715" y="165" width="225" height="80" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="2" filter="url(#mshadow)"/>
  <text x="827.5" y="198" text-anchor="middle" font-size="12.5" font-weight="800" fill="#0f172a">Urge to Buy Impulsively</text>
  <text x="827.5" y="218" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0284c7">(UBI) [Permission × Energy]</text>

  <!-- Box R2: OIB -->
  <rect x="715" y="315" width="225" height="80" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="2" filter="url(#mshadow)"/>
  <text x="827.5" y="348" text-anchor="middle" font-size="12.5" font-weight="800" fill="#0f172a">Online Impulse Buying</text>
  <text x="827.5" y="368" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0284c7">(OIB) [Checkout Execution]</text>

  <!-- ==================== STRUCTURAL PROPOSITION ARROWS ==================== -->
  <!-- P1: PP -> ESAT (Inverted-U) -->
  <line x1="240" y1="168" x2="325" y2="178" stroke="#0284c7" stroke-width="2" marker-end="url(#marr)"/>
  <rect x="253" y="150" width="58" height="18" rx="4" fill="#e0f2fe"/>
  <text x="282" y="163" text-anchor="middle" font-size="8.5" font-weight="800" fill="#0369a1">P1 (∩)</text>

  <!-- P2: ACC -> ESAT -->
  <line x1="240" y1="255" x2="325" y2="210" stroke="#0284c7" stroke-width="2" marker-end="url(#marr)"/>
  <rect x="256" y="225" width="48" height="18" rx="4" fill="#e0f2fe"/>
  <text x="280" y="238" text-anchor="middle" font-size="9" font-weight="800" fill="#0369a1">P2 (+)</text>

  <!-- P3: NOV -> AROUSAL -->
  <line x1="240" y1="362" x2="325" y2="372" stroke="#0284c7" stroke-width="2" marker-end="url(#marr)"/>
  <rect x="256" y="352" width="48" height="18" rx="4" fill="#e0f2fe"/>
  <text x="280" y="365" text-anchor="middle" font-size="9" font-weight="800" fill="#0369a1">P3 (+)</text>

  <!-- P4: ESAT -> UBI (direct) & into Interaction Node -->
  <line x1="590" y1="190" x2="710" y2="195" stroke="#0284c7" stroke-width="2.2" marker-end="url(#marr)"/>
  <rect x="635" y="175" width="46" height="18" rx="4" fill="#e0f2fe"/>
  <text x="658" y="188" text-anchor="middle" font-size="9" font-weight="800" fill="#0369a1">P4 (+)</text>
  <line x1="570" y1="246" x2="592" y2="258" stroke="#2563eb" stroke-width="1.8" stroke-dasharray="3,2"/>

  <!-- P5: AROUSAL -> UBI (direct) & into Interaction Node -->
  <line x1="590" y1="365" x2="710" y2="225" stroke="#0284c7" stroke-width="2.2" marker-end="url(#marr)"/>
  <rect x="640" y="295" width="46" height="18" rx="4" fill="#e0f2fe"/>
  <text x="663" y="308" text-anchor="middle" font-size="9" font-weight="800" fill="#0369a1">P5 (+)</text>
  <line x1="570" y1="330" x2="592" y2="287" stroke="#2563eb" stroke-width="1.8" stroke-dasharray="3,2"/>

  <!-- P5b: Interaction Node -> UBI -->
  <line x1="625" y1="270" x2="710" y2="215" stroke="#2563eb" stroke-width="2.5" marker-end="url(#marr)"/>

  <!-- P6: UBI -> OIB -->
  <line x1="827.5" y1="245" x2="827.5" y2="310" stroke="#0284c7" stroke-width="2.5" marker-end="url(#marr)"/>
  <rect x="836" y="268" width="48" height="18" rx="4" fill="#e0f2fe"/>
  <text x="860" y="281" text-anchor="middle" font-size="9" font-weight="800" fill="#0369a1">P6 (+)</text>

  <!-- ==================== MODERATOR & RECURSIVE FEEDBACK LOOP ==================== -->
  <!-- Moderator: Ego Depletion (Enhancer) -->
  <rect x="570" y="495" width="280" height="65" rx="8" fill="#fefce8" stroke="#f59e0b" stroke-width="1.5" filter="url(#mshadow)"/>
  <text x="710" y="518" text-anchor="middle" font-size="10.5" font-weight="800" fill="#b45309">ENHANCER BOUNDARY (P7)</text>
  <text x="710" y="540" text-anchor="middle" font-size="11.5" font-weight="800" fill="#92400e">Ego Depletion &amp; Cognitive Load</text>
  <line x1="780" y1="495" x2="827" y2="285" stroke="#d97706" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#marr-orange)"/>
  <rect x="780" y="420" width="48" height="18" rx="4" fill="#fef3c7"/>
  <text x="804" y="433" text-anchor="middle" font-size="9" font-weight="800" fill="#b45309">P7 (+)</text>

  <!-- Negative Recursive Feedback Loop (P9): OIB -> Post-Purchase Regret -> Erodes ESAT -->
  <path d="M 827.5 395 L 827.5 585 L 460 585 L 460 251" fill="none" stroke="#7c3aed" stroke-width="2.2" stroke-dasharray="6,4" marker-end="url(#marr-purple)"/>
  <rect x="110" y="495" width="320" height="65" rx="8" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5" filter="url(#mshadow)"/>
  <text x="270" y="518" text-anchor="middle" font-size="10.5" font-weight="800" fill="#6d28d9">NEGATIVE RECURSIVE FEEDBACK LOOP (P9)</text>
  <text x="270" y="540" text-anchor="middle" font-size="11" font-weight="700" fill="#4c1d95">Post-Purchase Regret Erodes Future E-Satisfaction</text>
  <rect x="468" y="438" width="52" height="18" rx="4" fill="#ede9fe"/>
  <text x="494" y="451" text-anchor="middle" font-size="9" font-weight="800" fill="#6d28d9">P9 (-)</text>
</svg>
