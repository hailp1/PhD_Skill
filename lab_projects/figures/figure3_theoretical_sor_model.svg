<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 610" width="100%" height="auto" style="font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif; background:#ffffff;">
  <defs>
    <marker id="marr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 Z" fill="#0284c7" />
    </marker>
    <marker id="marr-orange" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 Z" fill="#d97706" />
    </marker>
    <marker id="marr-purple" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 Z" fill="#7c3aed" />
    </marker>
    <filter id="mshadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Title Header -->
  <rect x="20" y="12" width="940" height="40" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="490" y="37" text-anchor="middle" font-size="13.5" font-weight="800" fill="#0f172a">FIGURE 3. DYNAMIC &amp; MULTIPLICATIVE DUAL-PATH S-O-R FRAMEWORK (GEN 1.0 TO GEN 2.0 AI)</text>

  <!-- TOP HIGHWAY: NEGATIVE RECURSIVE FEEDBACK LOOP (P9) -->
  <rect x="485" y="64" width="405" height="32" rx="6" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5" filter="url(#mshadow)"/>
  <text x="687.5" y="84" text-anchor="middle" font-size="9.5" font-weight="800" fill="#6d28d9">NEGATIVE RECURSIVE LOOP (P9): Regret Erodes ESAT &amp; Shifts P1/P8 Threshold</text>

  <!-- S-O-R COLUMN CONTAINERS (y=110 to 500) -->
  <!-- 1. STIMULUS CONTAINER -->
  <rect x="20" y="110" width="230" height="390" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4"/>
  <rect x="30" y="120" width="210" height="32" rx="6" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="135" y="140" text-anchor="middle" font-size="11.5" font-weight="800" fill="#0369a1">STIMULUS (S): AI GEN 1.0 &amp; 2.0</text>

  <!-- 2. ORGANISM CONTAINER (DUAL-PATH) -->
  <rect x="315" y="110" width="335" height="390" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4"/>
  <rect x="325" y="120" width="315" height="32" rx="6" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="482.5" y="140" text-anchor="middle" font-size="11.5" font-weight="800" fill="#0369a1">ORGANISM (O): DUAL-PATH STATES</text>

  <!-- 3. RESPONSE CONTAINER -->
  <rect x="705" y="110" width="240" height="390" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4"/>
  <rect x="715" y="120" width="220" height="32" rx="6" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="825" y="140" text-anchor="middle" font-size="11.5" font-weight="800" fill="#0369a1">RESPONSE (R): CONVERSION</text>

  <!-- ==================== BOXES INSIDE S ==================== -->
  <!-- Box S1: PP + Gen 2.0 Agency -->
  <rect x="35" y="168" width="200" height="82" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#mshadow)"/>
  <text x="135" y="191" text-anchor="middle" font-size="11.5" font-weight="800" fill="#0f172a">Perceived Personalization</text>
  <text x="135" y="209" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0284c7">(PP) &amp; GenAI Social Agency</text>
  <text x="135" y="229" text-anchor="middle" font-size="9.5" font-weight="700" fill="#e11d48">[Inverted-U Threshold: P1, P8]</text>

  <!-- Box S2: ACC -->
  <rect x="35" y="270" width="200" height="65" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#mshadow)"/>
  <text x="135" y="297" text-anchor="middle" font-size="11.5" font-weight="800" fill="#0f172a">Recommendation Accuracy</text>
  <text x="135" y="317" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0284c7">(ACC) [Expectancy Match]</text>

  <!-- Box S3: NOV + Conversational Persuasion -->
  <rect x="35" y="355" width="200" height="78" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#mshadow)"/>
  <text x="135" y="381" text-anchor="middle" font-size="11.5" font-weight="800" fill="#0f172a">Novelty &amp; Serendipity</text>
  <text x="135" y="400" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0284c7">(NOV) &amp; Real-Time Prompts</text>
  <text x="135" y="418" text-anchor="middle" font-size="9.5" font-weight="600" fill="#475569">[Cold-Start Discovery]</text>

  <!-- ==================== BOXES INSIDE O (DUAL-PATH + INTERACTION) ==================== -->
  <!-- Box O1: Cognitive Pathway (In-Session Fluency & E-Satisfaction) -->
  <rect x="328" y="170" width="242" height="106" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="2" filter="url(#mshadow)"/>
  <rect x="336" y="178" width="226" height="22" rx="4" fill="#dcfce7"/>
  <text x="449" y="193" text-anchor="middle" font-size="9.5" font-weight="800" fill="#15803d">COGNITIVE PERMISSION STRUCTURE</text>
  <text x="449" y="218" text-anchor="middle" font-size="11.5" font-weight="800" fill="#0f172a">In-Session Fluency &amp; E-Satisfaction</text>
  <text x="449" y="236" text-anchor="middle" font-size="10" font-weight="600" fill="#166534">(ESAT) [Disarmed Vigilance: P4a]</text>
  <text x="449" y="256" text-anchor="middle" font-size="9" font-weight="700" fill="#e11d48">Endogenous Reactance if PP Excess (P8)</text>

  <!-- Box O2: Affective Pathway (Emotional Arousal) -->
  <rect x="328" y="340" width="242" height="100" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="2" filter="url(#mshadow)"/>
  <rect x="336" y="348" width="226" height="22" rx="4" fill="#fee2e2"/>
  <text x="449" y="363" text-anchor="middle" font-size="9.5" font-weight="800" fill="#b91c1c">VISCERAL KINETIC ENERGY</text>
  <text x="449" y="390" text-anchor="middle" font-size="12" font-weight="800" fill="#0f172a">Emotional Arousal &amp; Flow</text>
  <text x="449" y="410" text-anchor="middle" font-size="10" font-weight="600" fill="#991b1b">(AROUSAL) [Hedonic Drive: P5a]</text>

  <!-- Multiplicative Interaction Node (ESAT x AROUSAL) -->
  <circle cx="618" cy="308" r="20" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5" filter="url(#mshadow)"/>
  <text x="618" y="314" text-anchor="middle" font-size="16" font-weight="800" fill="#1d4ed8">×</text>
  <rect x="572" y="332" width="92" height="18" rx="4" fill="#dbeafe"/>
  <text x="618" y="344" text-anchor="middle" font-size="8.5" font-weight="800" fill="#1e40af">Interaction (P5b)</text>

  <!-- ==================== BOXES INSIDE R ==================== -->
  <!-- Box R1: UBI -->
  <rect x="720" y="195" width="210" height="78" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="2" filter="url(#mshadow)"/>
  <text x="825" y="227" text-anchor="middle" font-size="12" font-weight="800" fill="#0f172a">Urge to Buy Impulsively</text>
  <text x="825" y="247" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0284c7">(UBI) [Permission × Energy]</text>

  <!-- Box R2: OIB -->
  <rect x="720" y="345" width="210" height="78" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="2" filter="url(#mshadow)"/>
  <text x="825" y="377" text-anchor="middle" font-size="12" font-weight="800" fill="#0f172a">Online Impulse Buying</text>
  <text x="825" y="397" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0284c7">(OIB) [Checkout Execution]</text>

  <!-- ==================== CLEAN NON-CROSSING ARROWS ==================== -->
  <!-- P1: PP -> ESAT (Inverted-U) -->
  <line x1="235" y1="205" x2="323" y2="205" stroke="#0284c7" stroke-width="2" marker-end="url(#marr)"/>
  <rect x="253" y="187" width="52" height="16" rx="4" fill="#e0f2fe"/>
  <text x="279" y="199" text-anchor="middle" font-size="8.5" font-weight="800" fill="#0369a1">P1 (∩)</text>

  <!-- P2: ACC -> ESAT -->
  <line x1="235" y1="295" x2="323" y2="245" stroke="#0284c7" stroke-width="2" marker-end="url(#marr)"/>
  <rect x="255" y="262" width="46" height="16" rx="4" fill="#e0f2fe"/>
  <text x="278" y="274" text-anchor="middle" font-size="8.5" font-weight="800" fill="#0369a1">P2 (+)</text>

  <!-- P3: NOV -> AROUSAL -->
  <line x1="235" y1="392" x2="323" y2="392" stroke="#0284c7" stroke-width="2" marker-end="url(#marr)"/>
  <rect x="255" y="374" width="46" height="16" rx="4" fill="#e0f2fe"/>
  <text x="278" y="386" text-anchor="middle" font-size="8.5" font-weight="800" fill="#0369a1">P3 (+)</text>

  <!-- P4: ESAT -> UBI (clean top horizontal arrow) -->
  <line x1="570" y1="215" x2="715" y2="215" stroke="#0284c7" stroke-width="2.2" marker-end="url(#marr)"/>
  <rect x="652" y="198" width="46" height="16" rx="4" fill="#e0f2fe"/>
  <text x="675" y="210" text-anchor="middle" font-size="8.5" font-weight="800" fill="#0369a1">P4 (+)</text>

  <!-- ESAT -> Interaction Node -->
  <line x1="570" y1="245" x2="603" y2="290" stroke="#2563eb" stroke-width="1.8" stroke-dasharray="3,2"/>

  <!-- AROUSAL -> Interaction Node (P5) -->
  <line x1="570" y1="375" x2="603" y2="326" stroke="#2563eb" stroke-width="1.8" stroke-dasharray="3,2"/>
  <rect x="546" y="302" width="46" height="16" rx="4" fill="#fee2e2"/>
  <text x="569" y="314" text-anchor="middle" font-size="8.5" font-weight="800" fill="#b91c1c">P5 (+)</text>

  <!-- Interaction Node -> UBI (P5b) -->
  <line x1="636" y1="298" x2="715" y2="245" stroke="#2563eb" stroke-width="2.5" marker-end="url(#marr)"/>

  <!-- P6: UBI -> OIB -->
  <line x1="825" y1="273" x2="825" y2="340" stroke="#0284c7" stroke-width="2.5" marker-end="url(#marr)"/>
  <rect x="765" y="298" width="48" height="18" rx="4" fill="#e0f2fe"/>
  <text x="789" y="311" text-anchor="middle" font-size="9" font-weight="800" fill="#0369a1">P6 (+)</text>

  <!-- ==================== CLEAN EXTERIOR BOUNDARY & FEEDBACK ARROWS ==================== -->
  <!-- Moderator: Ego Depletion (Enhancer) routed cleanly OUTSIDE right of OIB box -->
  <rect x="660" y="520" width="270" height="64" rx="8" fill="#fefce8" stroke="#f59e0b" stroke-width="1.5" filter="url(#mshadow)"/>
  <text x="795" y="544" text-anchor="middle" font-size="10.5" font-weight="800" fill="#b45309">ENHANCER BOUNDARY (P7)</text>
  <text x="795" y="566" text-anchor="middle" font-size="11.5" font-weight="800" fill="#92400e">Ego Depletion &amp; Cognitive Load</text>
  <path d="M 930 552 L 952 552 L 952 308 L 832 308" fill="none" stroke="#d97706" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#marr-orange)"/>
  <rect x="858" y="291" width="46" height="16" rx="4" fill="#fef3c7"/>
  <text x="881" y="303" text-anchor="middle" font-size="8.5" font-weight="800" fill="#b45309">P7 (+)</text>

  <!-- Negative Recursive Feedback Loop (P9) routed cleanly via TOP HIGHWAY to BOTH ESAT and PP (Inverted-U Threshold) -->
  <path d="M 930 384 L 966 384 L 966 80 L 890 80" fill="none" stroke="#7c3aed" stroke-width="2.2" stroke-dasharray="6,4"/>
  <path d="M 485 80 L 449 80 L 449 165" fill="none" stroke="#7c3aed" stroke-width="2.2" stroke-dasharray="6,4" marker-end="url(#marr-purple)"/>
  <path d="M 449 80 L 135 80 L 135 163" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#marr-purple)"/>
</svg>
