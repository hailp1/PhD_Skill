<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" height="auto" style="font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif; background:#ffffff;">
  <defs>
    <marker id="marr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 Z" fill="#0284c7" />
    </marker>
    <marker id="marr-orange" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 Z" fill="#d97706" />
    </marker>
    <marker id="marr-rose" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 Z" fill="#e11d48" />
    </marker>
    <filter id="mshadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Title Header -->
  <rect x="20" y="15" width="920" height="42" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="480" y="41" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a">FIGURE 3. INTEGRATIVE DUAL-PATH S-O-R CONCEPTUAL FRAMEWORK (P1–P8)</text>

  <!-- S-O-R COLUMN CONTAINERS -->
  <!-- 1. STIMULUS CONTAINER -->
  <rect x="25" y="75" width="230" height="380" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4"/>
  <rect x="35" y="85" width="210" height="32" rx="6" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="140" y="106" text-anchor="middle" font-size="12" font-weight="800" fill="#0369a1">STIMULUS (S): AI FEATURES</text>

  <!-- 2. ORGANISM CONTAINER (DUAL-PATH) -->
  <rect x="315" y="75" width="310" height="380" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4"/>
  <rect x="325" y="85" width="290" height="32" rx="6" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="470" y="106" text-anchor="middle" font-size="12" font-weight="800" fill="#0369a1">ORGANISM (O): DUAL-PATH STATES</text>

  <!-- 3. RESPONSE CONTAINER -->
  <rect x="685" y="75" width="250" height="380" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4"/>
  <rect x="695" y="85" width="230" height="32" rx="6" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="810" y="106" text-anchor="middle" font-size="12" font-weight="800" fill="#0369a1">RESPONSE (R): BEHAVIOR</text>

  <!-- ==================== BOXES INSIDE S ==================== -->
  <!-- Box S1: PP -->
  <rect x="40" y="135" width="200" height="65" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#mshadow)"/>
  <text x="140" y="162" text-anchor="middle" font-size="12" font-weight="800" fill="#0f172a">Perceived Personalization</text>
  <text x="140" y="182" text-anchor="middle" font-size="11" font-weight="600" fill="#0284c7">(PP) [Cognitive Fit]</text>

  <!-- Box S2: ACC -->
  <rect x="40" y="225" width="200" height="65" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#mshadow)"/>
  <text x="140" y="252" text-anchor="middle" font-size="12" font-weight="800" fill="#0f172a">Recommendation Accuracy</text>
  <text x="140" y="272" text-anchor="middle" font-size="11" font-weight="600" fill="#0284c7">(ACC) [Expectancy Match]</text>

  <!-- Box S3: NOV -->
  <rect x="40" y="315" width="200" height="65" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#mshadow)"/>
  <text x="140" y="342" text-anchor="middle" font-size="12" font-weight="800" fill="#0f172a">Novelty &amp; Serendipity</text>
  <text x="140" y="362" text-anchor="middle" font-size="11" font-weight="600" fill="#0284c7">(NOV) [Hedonic Surprise]</text>

  <!-- ==================== BOXES INSIDE O (DUAL-PATH) ==================== -->
  <!-- Box O1: Cognitive Pathway (Cumulative E-Satisfaction) -->
  <rect x="335" y="145" width="270" height="105" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="2" filter="url(#mshadow)"/>
  <rect x="345" y="155" width="250" height="24" rx="4" fill="#dcfce7"/>
  <text x="470" y="171" text-anchor="middle" font-size="10.5" font-weight="800" fill="#15803d">COGNITIVE PATHWAY (FLUENCY)</text>
  <text x="470" y="202" text-anchor="middle" font-size="13" font-weight="800" fill="#0f172a">Cumulative E-Satisfaction</text>
  <text x="470" y="222" text-anchor="middle" font-size="11" font-weight="600" fill="#166534">(ESAT) [Disarmed Vigilance]</text>

  <!-- Box O2: Affective Pathway (Emotional Arousal) -->
  <rect x="335" y="295" width="270" height="105" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="2" filter="url(#mshadow)"/>
  <rect x="345" y="305" width="250" height="24" rx="4" fill="#fee2e2"/>
  <text x="470" y="321" text-anchor="middle" font-size="10.5" font-weight="800" fill="#b91c1c">AFFECTIVE PATHWAY (AROUSAL)</text>
  <text x="470" y="352" text-anchor="middle" font-size="13" font-weight="800" fill="#0f172a">Emotional Arousal &amp; Flow</text>
  <text x="470" y="372" text-anchor="middle" font-size="11" font-weight="600" fill="#991b1b">(AROUSAL) [Hedonic Flow]</text>

  <!-- ==================== BOXES INSIDE R ==================== -->
  <!-- Box R1: UBI -->
  <rect x="705" y="165" width="210" height="80" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="2" filter="url(#mshadow)"/>
  <text x="810" y="198" text-anchor="middle" font-size="13" font-weight="800" fill="#0f172a">Urge to Buy Impulsively</text>
  <text x="810" y="220" text-anchor="middle" font-size="11" font-weight="600" fill="#0284c7">(UBI) [Visceral Desire]</text>

  <!-- Box R2: OIB -->
  <rect x="705" y="305" width="210" height="80" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="2" filter="url(#mshadow)"/>
  <text x="810" y="338" text-anchor="middle" font-size="13" font-weight="800" fill="#0f172a">Online Impulse Buying</text>
  <text x="810" y="360" text-anchor="middle" font-size="11" font-weight="600" fill="#0284c7">(OIB) [Checkout Execution]</text>

  <!-- ==================== STRUCTURAL PROPOSITION ARROWS ==================== -->
  <!-- P1: PP -> ESAT -->
  <line x1="240" y1="168" x2="330" y2="185" stroke="#0284c7" stroke-width="2" marker-end="url(#marr)"/>
  <rect x="260" y="162" width="48" height="18" rx="4" fill="#e0f2fe"/>
  <text x="284" y="175" text-anchor="middle" font-size="9" font-weight="800" fill="#0369a1">P1 (+)</text>

  <!-- P2: ACC -> ESAT -->
  <line x1="240" y1="245" x2="330" y2="215" stroke="#0284c7" stroke-width="2" marker-end="url(#marr)"/>
  <rect x="260" y="220" width="48" height="18" rx="4" fill="#e0f2fe"/>
  <text x="284" y="233" text-anchor="middle" font-size="9" font-weight="800" fill="#0369a1">P2 (+)</text>

  <!-- P3: NOV -> AROUSAL -->
  <line x1="240" y1="348" x2="330" y2="348" stroke="#0284c7" stroke-width="2" marker-end="url(#marr)"/>
  <rect x="260" y="338" width="48" height="18" rx="4" fill="#e0f2fe"/>
  <text x="284" y="351" text-anchor="middle" font-size="9" font-weight="800" fill="#0369a1">P3 (+)</text>

  <!-- P4: ESAT -> UBI -->
  <line x1="605" y1="195" x2="700" y2="202" stroke="#0284c7" stroke-width="2.5" marker-end="url(#marr)"/>
  <rect x="630" y="185" width="48" height="18" rx="4" fill="#e0f2fe"/>
  <text x="654" y="198" text-anchor="middle" font-size="9" font-weight="800" fill="#0369a1">P4 (+)</text>

  <!-- P5: AROUSAL -> UBI -->
  <line x1="605" y1="330" x2="700" y2="230" stroke="#0284c7" stroke-width="2.5" marker-end="url(#marr)"/>
  <rect x="635" y="270" width="48" height="18" rx="4" fill="#e0f2fe"/>
  <text x="659" y="283" text-anchor="middle" font-size="9" font-weight="800" fill="#0369a1">P5 (+)</text>

  <!-- P6: UBI -> OIB -->
  <line x1="810" y1="245" x2="810" y2="300" stroke="#0284c7" stroke-width="2.5" marker-end="url(#marr)"/>
  <rect x="818" y="262" width="48" height="18" rx="4" fill="#e0f2fe"/>
  <text x="842" y="275" text-anchor="middle" font-size="9" font-weight="800" fill="#0369a1">P6 (+)</text>

  <!-- ==================== BOUNDARY CONDITIONS (MODERATORS) ==================== -->
  <!-- Top Moderator: Surveillance Reactance (Suppressor) -->
  <rect x="180" y="475" width="280" height="65" rx="8" fill="#fff1f2" stroke="#f43f5e" stroke-width="1.5" filter="url(#mshadow)"/>
  <text x="320" y="498" text-anchor="middle" font-size="11" font-weight="800" fill="#be123c">SUPPRESSOR BOUNDARY (P8)</text>
  <text x="320" y="520" text-anchor="middle" font-size="12" font-weight="800" fill="#9f1239">Algorithmic Surveillance Reactance</text>
  <!-- Arrow from P8 to S->O paths -->
  <line x1="280" y1="475" x2="280" y2="250" stroke="#e11d48" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#marr-rose)"/>
  <rect x="290" y="380" width="48" height="18" rx="4" fill="#fee2e2"/>
  <text x="314" y="393" text-anchor="middle" font-size="9" font-weight="800" fill="#be123c">P8 (-)</text>

  <!-- Bottom Moderator: Ego Depletion (Enhancer) -->
  <rect x="520" y="475" width="280" height="65" rx="8" fill="#fefce8" stroke="#f59e0b" stroke-width="1.5" filter="url(#mshadow)"/>
  <text x="660" y="498" text-anchor="middle" font-size="11" font-weight="800" fill="#b45309">ENHANCER BOUNDARY (P7)</text>
  <text x="660" y="520" text-anchor="middle" font-size="12" font-weight="800" fill="#92400e">Ego Depletion &amp; Cognitive Load</text>
  <!-- Arrow from P7 to UBI->OIB path -->
  <line x1="750" y1="475" x2="810" y2="280" stroke="#d97706" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#marr-orange)"/>
  <rect x="750" y="395" width="48" height="18" rx="4" fill="#fef3c7"/>
  <text x="774" y="408" text-anchor="middle" font-size="9" font-weight="800" fill="#b45309">P7 (+)</text>
</svg>
